<div class="flex flex-col min-h-full font-['Poppins'] bg-syndify-bg overflow-x-hidden w-full max-w-full">

  <app-page-header 
    class="shrink-0 relative w-full"
    [parentPath]="residence.nom || 'Résidence'"
    currentPath="Paramétrage"
    title="Paramétrage du compte"
    description="Gérez l'ensemble de vos données en toute simplicité.">
    
    <div class="w-full md:w-auto mt-3 md:mt-0 md:absolute md:right-6 lg:right-8 md:top-1/2 md:-translate-y-1/2 flex flex-wrap items-center gap-3 z-50">
      <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg border border-white/10 backdrop-blur-sm shadow-sm">
        <svg class="w-4 h-4 text-[#F4B840]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        <span class="text-white font-bold text-[12px] md:text-[12.5px] tracking-wide">Compte Sécurisé</span>
      </div>

      <div class="flex items-center gap-2 hidden sm:flex">
        <span class="text-white/70 text-[12px] md:text-[13px] font-medium tracking-wide">Connexion :</span>
        <span class="text-white font-bold text-[12px] md:text-[13.5px] tracking-wide">Aujourd'hui</span>
      </div>
    </div>

  </app-page-header>

  <div class="flex-1 p-4 md:p-6 lg:p-8 overflow-visible w-full min-w-0 max-w-full box-border">
    
    <div class="w-full flex flex-col gap-6 md:gap-8">
      
      <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden flex flex-col shadow-none">
        
        <div class="px-5 md:px-8 py-4 md:py-5 border-b border-gray-100 bg-white">
          <h3 class="text-[16px] md:text-[17px] font-bold text-syndify-dark tracking-tight m-0">Informations du Syndic</h3>
          <p class="text-[12px] md:text-[12.5px] text-gray-500 font-medium mt-1 m-0">Mettez à jour vos coordonnées personnelles et de contact.</p>
        </div>
        
        <div class="p-5 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
          <div>
            <label class="block text-[12px] md:text-[13px] font-semibold text-gray-700 mb-1.5">Nom complet <span class="text-red-500">*</span></label>
            <input type="text" [(ngModel)]="syndic.nom" placeholder="Ex: Karim Benali" class="w-full text-[13px] md:text-[13.5px] font-medium border border-gray-200 rounded-xl px-4 py-2.5 md:py-3 outline-none focus:bg-white focus:border-syndify-accent focus:ring-2 focus:ring-syndify-accent/20 transition-all shadow-none">
          </div>
          <div>
            <label class="block text-[12px] md:text-[13px] font-semibold text-gray-700 mb-1.5">Téléphone <span class="text-red-500">*</span></label>
            <input type="text" [(ngModel)]="syndic.telephone" placeholder="Ex: 06 12 34 56 78" class="w-full text-[13px] md:text-[13.5px] font-medium border border-gray-200 rounded-xl px-4 py-2.5 md:py-3 outline-none focus:bg-white focus:border-syndify-accent focus:ring-2 focus:ring-syndify-accent/20 transition-all shadow-none">
          </div>
          
          <div class="md:col-span-2">
            <label class="block text-[12px] md:text-[13px] font-semibold text-gray-700 mb-1.5">Adresse Email <span class="text-red-500">*</span></label>
            <input type="email" [(ngModel)]="syndic.email" placeholder="contact@syndic.com" class="w-full text-[13px] md:text-[13.5px] font-medium border border-gray-200 rounded-xl px-4 py-2.5 md:py-3 outline-none focus:bg-white focus:border-syndify-accent focus:ring-2 focus:ring-syndify-accent/20 transition-all shadow-none">
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden flex flex-col shadow-none">
        
        <div class="px-5 md:px-8 py-4 md:py-5 border-b border-gray-100 bg-white">
          <h3 class="text-[16px] md:text-[17px] font-bold text-syndify-dark tracking-tight m-0">Informations de la Résidence</h3>
          <p class="text-[12px] md:text-[12.5px] text-gray-500 font-medium mt-1 m-0">Modifiez les détails de la copropriété que vous gérez.</p>
        </div>
        
        <div class="p-5 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
          
          <div>
            <label class="block text-[12px] md:text-[13px] font-semibold text-gray-700 mb-1.5">Numéro SIRET</label>
            <input type="text" [(ngModel)]="residence.siret" placeholder="Entrez le SIRET" class="w-full text-[13px] md:text-[13.5px] font-medium border border-gray-200 rounded-xl px-4 py-2.5 md:py-3 outline-none focus:bg-white focus:border-syndify-accent focus:ring-2 focus:ring-syndify-accent/20 transition-all shadow-none">
          </div>

          <div>
            <label class="block text-[12px] md:text-[13px] font-semibold text-gray-700 mb-1.5">Nom de la résidence <span class="text-red-500">*</span></label>
            <input type="text" [(ngModel)]="residence.nom" placeholder="Ex: Résidence Les Jardins de l'Océan" class="w-full text-[13px] md:text-[13.5px] font-medium border border-gray-200 rounded-xl px-4 py-2.5 md:py-3 outline-none focus:bg-white focus:border-syndify-accent focus:ring-2 focus:ring-syndify-accent/20 transition-all shadow-none">
          </div>
          
          <div class="md:col-span-2">
            <label class="block text-[12px] md:text-[13px] font-semibold text-gray-700 mb-1.5">Adresse complète</label>
            <input type="text" [(ngModel)]="residence.adresse" placeholder="Ex: Angle Boulevard Ghandi..." class="w-full text-[13px] md:text-[13.5px] font-medium border border-gray-200 rounded-xl px-4 py-2.5 md:py-3 outline-none focus:bg-white focus:border-syndify-accent focus:ring-2 focus:ring-syndify-accent/20 transition-all shadow-none">
          </div>

          <div>
            <label class="block text-[12px] md:text-[13px] font-semibold text-gray-700 mb-1.5">Ville <span class="text-red-500">*</span></label>
            <input type="text" [(ngModel)]="residence.ville" placeholder="Ex: Casablanca" class="w-full text-[13px] md:text-[13.5px] font-medium border border-gray-200 rounded-xl px-4 py-2.5 md:py-3 outline-none focus:bg-white focus:border-syndify-accent focus:ring-2 focus:ring-syndify-accent/20 transition-all shadow-none">
          </div>
          
          <div>
            <label class="block text-[12px] md:text-[13px] font-semibold text-gray-700 mb-1.5">Code Postal</label>
            <input type="text" [(ngModel)]="residence.code_postal" placeholder="Ex: 20000" class="w-full text-[13px] md:text-[13.5px] font-medium border border-gray-200 rounded-xl px-4 py-2.5 md:py-3 outline-none focus:bg-white focus:border-syndify-accent focus:ring-2 focus:ring-syndify-accent/20 transition-all shadow-none">
          </div>

        </div>
      </div>

      <div class="flex justify-end pt-2 pb-12 w-full">
        <button (click)="sauvegarderParametres()" [disabled]="isLoading" class="btn-primary w-full md:w-auto justify-center px-8 py-3.5 rounded-xl text-[13px] font-bold border-0 shadow-none">
          <svg *ngIf="!isLoading" class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
          <svg *ngIf="isLoading" class="w-4 h-4 mr-2 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          {{ isLoading ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </div>

    </div>
  </div>
  
  <div class="fixed bottom-4 left-4 right-4 md:bottom-6 md:left-1/2 md:-translate-x-1/2 md:right-auto z-[999] transition-all duration-300 ease-out transform"
       [ngClass]="showNotification ? 'translate-y-0 opacity-100' : 'translate-y-4 opacity-0 pointer-events-none'">
    <div class="flex items-center gap-3 px-4 md:px-5 py-3 md:py-3.5 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] border w-full max-w-sm md:max-w-md mx-auto"
         [ngClass]="{
           'bg-green-50 border-green-100 text-green-800': notificationType === 'success',
           'bg-red-50 border-red-100 text-red-800': notificationType === 'error'
         }">
      <div *ngIf="notificationType === 'success'" class="w-7 h-7 md:w-8 md:h-8 rounded-full bg-green-100 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <div *ngIf="notificationType === 'error'" class="w-7 h-7 md:w-8 md:h-8 rounded-full bg-red-100 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      </div>
      <p class="text-[12px] md:text-[13.5px] font-semibold pr-2 flex-1">{{ notificationMessage }}</p>
      <button (click)="showNotification = false" class="ml-2 w-6 h-6 flex items-center justify-center rounded-full hover:bg-black/5 transition-colors shrink-0 cursor-pointer" [ngClass]="notificationType === 'success' ? 'text-green-600' : 'text-red-600'">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  </div>

</div>
