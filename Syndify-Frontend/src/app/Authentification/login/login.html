<div class="min-h-screen w-screen flex items-center justify-center font-['Poppins'] overflow-hidden relative bg-cover bg-center bg-no-repeat" style="background-image: url('assets/images/bg-login.jpg');">
    
    <div class="absolute inset-0 bg-black/20 z-0"></div>

    <div class="relative z-10 w-full max-w-[450px] mx-4">
        <div class="bg-white/95 backdrop-blur-xl p-6 sm:p-10 md:p-12 rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.5)] border border-white/50">
            
            <div class="flex justify-center mb-8">
                <div class="w-16 h-16 bg-syndify-dark rounded-2xl flex items-center justify-center shadow-lg transform hover:scale-105 transition-all">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                </div>
            </div>

            <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm font-bold rounded">
                {{ errorMessage }}
            </div>

            <!-- L'Interface jdida -->
            <div class="text-center mb-8">
                <h1 class="text-[28px] font-black text-syndify-text tracking-tight">Connexion</h1>
                <p class="text-gray-500 font-medium mt-1">Accès sécurisé via IDP Nomade</p>
            </div>

            <button type="button" (click)="onLoginClick()" [disabled]="isLoading()" 
                    class="w-full bg-syndify-dark text-white font-black py-4 rounded-2xl hover:bg-black transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed border-0 shadow-none">
                <span>{{ isLoading() ? 'Chargement en cours...' : 'Se connecter' }}</span>
                <svg *ngIf="!isLoading()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                </svg>
            </button>

        </div>
    </div>

    <div class="absolute bottom-6 z-10 text-white/80 text-[11px] font-semibold tracking-wider">
        Syndify Management &copy; 2026
    </div>
</div>
