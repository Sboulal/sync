services:
  syndify_backend:
    build:
      context: ./Syndify-Backend
      dockerfile: Dockerfile
    container_name: syndify_backend
    command: php -d memory_limit=-1 artisan serve --host=0.0.0.0 --port=8000
    restart: unless-stopped
    ports:
      - "8101:8000"
    # volumes:
    #   - ./Syndify-Backend:/var/www
    #   - /var/www/vendor # 🟢 HADI GHATMN3 L'HOST Y-ECRASI VENDOR DYAL DOCKER
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8101" # 🟢 ZID HADI BACH LES REDIRECTIONS YKHDMO S7A7
      DB_CONNECTION: pgsql
      DB_HOST: postgres-local
      DB_PORT: 5432
      DB_DATABASE: syndic_db
      DB_USERNAME: postgres
      DB_PASSWORD: salma123
    networks:
      - syndify_network
    depends_on:
      - postgres-local

  postgres-local:
    image: postgres:15-alpine
    container_name: syndify_db_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: syndic_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: salma123
    ports:
      - "5432:5432"
    volumes:
      - syndify_db_data:/var/lib/postgresql/data
    networks:
      - syndify_network

networks:
  syndify_network:
    driver: bridge

# 🟢 ZEDNA HADI BASH MAY3TIKCH ERREUR DYAL VOLUME UNDEFINED
volumes:
  syndify_db_data: